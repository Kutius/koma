name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the draft release, and the uploads to it

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version mygo.json)"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            args=(--draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}"
          fi

  verify:
    needs: draft-release
    uses: ./.github/workflows/ci.yml
    with:
      skip-build-check: true

  build:
    needs: draft-release
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS, for the Windows installers
        if: matrix.name == 'Windows' && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: go tool mygo build -platform "${{ matrix.platform }}" -upload
      - name: Upload portable Koma.exe
        if: matrix.name == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" build/windows-amd64/Koma.exe \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify required release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          assets="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for required in \
            "Koma.exe" \
            "SHA256SUMS" \
            "koma-setup-${ver}-amd64.exe" \
            "koma-setup-${ver}-arm64.exe" \
            "update-windows-amd64.json" \
            "update-windows-arm64.json"; do
            if ! printf '%s\n' "$assets" | grep -Fxq "$required"; then
              echo "Missing required release asset: $required" >&2
              exit 1
            fi
          done
      - name: Generate release notes and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          notes_file="$(mktemp)"

          changelog_body="$(awk -v ver="$ver" '
            $0 == "## " ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d')"

          {
            echo "## Koma ${GITHUB_REF_NAME}"
            echo ""
            if [ -n "$changelog_body" ]; then
              printf '%s\n' "$changelog_body"
            else
              echo "- Maintenance release ${GITHUB_REF_NAME}."
            fi
            echo ""
            echo "### 下载说明"
            echo ""
            echo "- **便携版（免安装）**：直接下载 \`Koma.exe\` 运行（Windows x64）。"
            echo "- **安装程序**：下载 \`koma-setup-${ver}-amd64.exe\`（x64）或 \`koma-setup-${ver}-arm64.exe\`（ARM64）。"
            echo "- **已安装旧版本用户**：可直接通过应用内「检查更新」自动下载差分增量包升级。"

            is_pre=0
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then
              is_pre=1
            fi
            prev_tag="$(git -c versionsort.suffix=- ls-remote --tags --refs --sort=-v:refname origin 'refs/tags/v*' | awk -v cur="$GITHUB_REF_NAME" -v pre="$is_pre" '
              {
                tag = $2
                sub(/^refs\/tags\//, "", tag)
                if (tag == cur) { seen=1; next }
                if (seen && (pre == 1 || index(tag, "-") == 0)) { print tag; exit }
              }
            ')"
            if [ -n "$prev_tag" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev_tag}...${GITHUB_REF_NAME}"
            fi
          } > "$notes_file"

          args=(--draft=false --title "Koma ${GITHUB_REF_NAME}" --notes-file "$notes_file")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--latest)
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${args[@]}"
